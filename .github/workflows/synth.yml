name: Morphology Fabric Multi-Synthesis

on:
  push:
  workflow_dispatch:

jobs:
  synth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Yosys
        run: |
          sudo apt update
          sudo apt install -y yosys

      - name: Show Repository Structure
        run: |
          find .

      ############################################################
      # Single Cell
      ############################################################

      - name: Synthesize morpho_cell
        run: |
          yosys -p "
            read_verilog rtl/morpho_cell.v

            hierarchy -check -top morpho_cell

            proc
            opt
            synth

            stat
          " > morpho_cell_report.txt

      - name: Upload morpho_cell Report
        uses: actions/upload-artifact@v4
        with:
          name: morpho-cell-report
          path: morpho_cell_report.txt

      ############################################################
      # 4x4 Grid
      ############################################################

      - name: Synthesize morpho_grid_4x4
        run: |
          yosys -p "
            read_verilog rtl/morpho_cell.v rtl/morpho_grid_4x4.v

            hierarchy -check -top morpho_grid_4x4

            proc
            opt
            synth

            stat
          " > morpho_grid_4x4_report.txt

      - name: Upload morpho_grid_4x4 Report
        uses: actions/upload-artifact@v4
        with:
          name: morpho-grid-4x4-report
          path: morpho_grid_4x4_report.txt

      ############################################################
      # 8x8 Grid
      ############################################################

      - name: Synthesize morpho_grid_8x8
        run: |
          yosys -p "
            read_verilog rtl/morpho_cell.v rtl/morpho_grid_8x8.v

            hierarchy -check -top morpho_grid_8x8

            proc
            opt
            synth

            stat
          " > morpho_grid_8x8_report.txt

      - name: Upload morpho_grid_8x8 Report
        uses: actions/upload-artifact@v4
        with:
          name: morpho-grid-8x8-report
          path: morpho_grid_8x8_report.txt

      ############################################################
      # Summary in Logs
      ############################################################

      - name: Print Reports
        run: |
          echo "===== MORPHO CELL ====="
          tail -n 50 morpho_cell_report.txt

          echo ""
          echo "===== MORPHO GRID 4x4 ====="
          tail -n 50 morpho_grid_4x4_report.txt

          echo ""
          echo "===== MORPHO GRID 8x8 ====="
          tail -n 50 morpho_grid_8x8_report.txt
